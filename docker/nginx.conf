# One origin for the SPA and the API, over TLS. There is no plain-HTTP deployment (§16.6): a risk a
# deployment may accept is a risk every rushed deployment will accept, and the camera needs a secure
# context to work at all (§18).

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/simon.crt;
    ssl_certificate_key /etc/nginx/certs/simon.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:2m;

    # A receipt printer's payload is small; an import file is not (§19.1).
    client_max_body_size 8m;

    # The SPA is precached by its service worker, so the shell may be cached hard — but never
    # index.html or the worker itself, or a shop would keep opening yesterday's app.
    location /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        root /usr/share/nginx/html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        root /usr/share/nginx/html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        root /usr/share/nginx/html;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
